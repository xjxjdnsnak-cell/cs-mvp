name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # impact_engine and its tests only need the stdlib plus yaml/flask/agent-framework;
          # torch is intentionally not installed here (not imported by impact_engine).
          pip install pytest pyyaml flask agent-framework-openai

      - name: Byte-compile all sources
        run: python -m compileall -q demo_analysis demoparser_utils data dataset models scripts

      - name: Import smoke test
        run: python -c "import demo_analysis.impact_engine; import demo_analysis.impact_engine.highlight_moments"

      - name: Run impact engine tests
        run: pytest demo_analysis/impact_engine/tests -q
