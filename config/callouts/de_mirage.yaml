routes:
  - name: t_mid_control
    side: T
    phase: take_mid
    from: t_spawn
    through:
      - top_mid
      - mid_boxes
    goals:
      - connector
      - window
      - short
    key_areas:
      - top_mid
      - mid_boxes
    failure_conditions:
      - early_death
      - lost_control

  - name: t_a_execute
    side: T
    phase: site_execute
    from: a_ramp
    through:
      - palace
    goals:
      - a_site
      - default_plant_a
    key_areas:
      - a_ramp
      - a_site
    failure_conditions:
      - no_plant
      - early_death

  - name: t_b_execute
    side: T
    phase: site_execute
    from: b_apps
    through: []
    goals:
      - b_site
      - default_plant_b
    key_areas:
      - b_apps
      - b_site
    failure_conditions:
      - no_plant
      - early_death

  - name: t_underpass_split
    side: T
    phase: take_mid
    from: underpass
    through: []
    goals:
      - connector
      - short
    key_areas:
      - underpass
    failure_conditions:
      - early_death

  - name: ct_mid_hold
    side: CT
    phase: hold_mid
    from: window
    through:
      - connector
      - short
    goals:
      - top_mid
    key_areas:
      - window
      - short
    failure_conditions:
      - lost_control

  - name: ct_a_hold
    side: CT
    phase: hold_site
    from: ticket
    through:
      - stairs
      - jungle
    goals:
      - a_site
    key_areas:
      - ticket
      - stairs
    failure_conditions:
      - lost_site

  - name: ct_b_hold
    side: CT
    phase: hold_site
    from: market_window
    through:
      - market_door
      - short
    goals:
      - b_site
    key_areas:
      - market_window
      - market_door
    failure_conditions:
      - lost_site

  - name: ct_a_retake
    side: CT
    phase: retake
    from: ct_spawn
    through:
      - jungle
      - stairs
    goals:
      - a_site
    key_areas:
      - jungle
      - stairs
    failure_conditions:
      - failed_retake

  - name: ct_b_retake
    side: CT
    phase: retake
    from: market
    through:
      - short
    goals:
      - b_site
    key_areas:
      - market
      - short_to_b
    failure_conditions:
      - failed_retake

sightlines:
  - name: window_to_top_mid
    from_area: window
    to_area: top_mid
    importance: high
    used_by: CT
    blocked_by_smokes:
