smoke_targets:
  mirage_window_smoke:
    map: de_mirage
    intent: execute_smoke
    target_area: window
    target_center: [-1174, -744]
    smoke_radius: 170
    target_match_radius_multiplier: 1.2
    required_block_lines:
      - name: window_to_top_mid
        from_area: window
        to_area: top_mid
        from_xy: [-1174, -744]
        to_xy: [-150, -700]
      - name: window_to_connector_path
        from_area: window
        to_area: connector
        from_xy: [-1174, -744]
        to_xy: [-801, -25]
    teammate_cross_routes:
      - top_mid_to_connector
    allowed_leak_tolerance: 0.15
    counter_he_zones:
      - name: top_mid_cross
        name_cn: 中路过点
        polygon:
          - [-300, -900]
          - [100, -900]
          - [100, -520]
